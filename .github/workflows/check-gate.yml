# check:gate on every push and pull request, on Linux with the pinned Node (ADR-0011).
# The capture job films the demo on the canonical capture runtime, a pinned ubuntu-24.04
# image: published videos come from it, since a capture's bytes hold per runtime
# (ADR-0010). It is not part of the gate and runs on main and on demand only.
name: check-gate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      frames:
        description: Also write the lossless PNG sequences (about 280 MB)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: check:gate (ubuntu-latest, Node from .node-version)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Full history: check:docs looks up the commits that status.md and progress.md name.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:gate
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-reports
          path: |
            reports/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  capture:
    name: capture:demo on the canonical runtime (ubuntu-24.04)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    # Pinned, not ubuntu-latest, so the canonical bytes do not move when the image does.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium ffmpeg
      - run: npm run capture:demo -- ${{ inputs.frames && '--frames' || '' }}
      - run: cat captures/murmuration.json
      - uses: actions/upload-artifact@v7
        with:
          name: demo-capture
          path: captures/
          retention-days: 7
